name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: prasanthloganathan
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            prasanthloganathan/static-site:latest
            prasanthloganathan/static-site:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy step
        run: echo "Manual approval received! Deploying to production environment..."

      - name: Perform Application Health Check
        id: healthcheck
        run: |
          echo "Checking EC2 application health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://15.252.17.61)
          if [ "$response" -eq 200 ]; then
            echo "Health Check Passed! HTTP Status Code: $response"
          else
            echo "Health Check Failed! HTTP Status Code: $response"
            exit 1
          fi

      # 1. Email Notification: Deployment Success
      - name: Send Email on Deployment Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 Deployment Succeeded: ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions Workflow
          body: |
            The deployment for commit ${{ github.sha }} succeeded!
            Application is healthy at http://15.252.17.61.

      # 2. Email Notification: Health Check Failed
      - name: Send Email on Health Check Failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 Health Check Failed: ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions Workflow
          body: |
            Health check failed for commit ${{ github.sha }}.
            Please check the application status immediately!

  rollback-notification:
    runs-on: ubuntu-latest
    needs: deploy
    if: cancelled() || failure()
    steps:
      # 3. Email Notification: Rollback Executed
      - name: Send Email on Rollback Execution
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ Rollback Triggered: ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions Workflow
          body: |
            Deployment or health check failed. Rollback execution step was triggered for run #${{ github.run_number }}.
