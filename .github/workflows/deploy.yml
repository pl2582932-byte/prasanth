deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy step
        run: echo "Manual approval received! Deploying to production environment..."

      - name: Perform Application Health Check
        run: |
          echo "Checking EC2 application health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://15.252.17.61)
          if [ "$response" -eq 200 ]; then
            echo "Health Check Passed! HTTP Status Code: $response"
          else
            echo "Health Check Failed! HTTP Status Code: $response"
            exit 1
          fi
